# Cloudflare Worker Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "quran-tafsir-proxy"
main = "tafsir-proxy.js"
compatibility_date = "2024-01-01"

# Account ID (you'll get this after creating a Cloudflare account)
# Uncomment and fill in after running: wrangler login
# account_id = "your-account-id-here"

# Worker will be deployed to: https://quran-tafsir-proxy.YOUR-SUBDOMAIN.workers.dev
workers_dev = true

# Routes (optional - for custom domains)
# [env.production]
# workers_dev = false
# routes = [
#   { pattern = "tafsir.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (optional)
# [vars]
# ENVIRONMENT = "production"
